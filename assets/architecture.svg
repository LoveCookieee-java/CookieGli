<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #ffffff; }
    .arrow { stroke: #64748b; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
  </style>

  <!-- Background -->
  <rect width="920" height="440" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <text x="30" y="38" class="title" style="font-size: 18px; fill: #38bdf8;">🍪 CookieGli Architecture Overview</text>
  <text x="30" y="58" class="subtitle">Autonomous Context Genome Compressor &amp; Bayesian Darwin Memory Pipeline</text>

  <!-- Flow Steps -->
  
  <!-- Step 1: Input Codebase -->
  <g transform="translate(30, 85)" filter="url(#shadow)">
    <rect width="180" height="135" rx="10" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#accentCyan)"/>
    <text x="18" y="25" class="badge-text">STAGE 1</text>
    <text x="14" y="48" class="title">Project Codebase</text>
    <text x="14" y="68" class="subtitle">• Multi-lang Source Files</text>
    <text x="14" y="86" class="subtitle">• Python, TS, JS, Go, Rust</text>
    <text x="14" y="104" class="subtitle">• Dependencies &amp; Configs</text>
    <text x="14" y="122" class="subtitle">• ~30k - 100k Raw Tokens</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 215 152 L 255 152" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <polygon points="255,152 247,147 247,157" fill="#38bdf8"/>

  <!-- Step 2: AstScanner & Filter -->
  <g transform="translate(260, 85)" filter="url(#shadow)">
    <rect width="190" height="135" rx="10" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#accentCyan)"/>
    <text x="18" y="25" class="badge-text">STAGE 2</text>
    <text x="14" y="48" class="title">AstScanner Core</text>
    <text x="14" y="68" class="subtitle">• Deep Python AST Parser</text>
    <text x="14" y="86" class="subtitle">• Arrow Functions &amp; Types</text>
    <text x="14" y="104" class="subtitle">• Minification Guard (&gt;250c)</text>
    <text x="14" y="122" class="subtitle">• File Size Limits (&lt;500KB)</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 455 152 L 495 152" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="495,152 487,147 487,157" fill="#10b981"/>

  <!-- Step 3: Genome Engine -->
  <g transform="translate(500, 85)" filter="url(#shadow)">
    <rect width="190" height="135" rx="10" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#accentEmerald)"/>
    <text x="18" y="25" class="badge-text">STAGE 3</text>
    <text x="14" y="48" class="title">GenomeEngine</text>
    <text x="14" y="68" class="subtitle">• 1. ArchitectureDNA</text>
    <text x="14" y="86" class="subtitle">• 2. DependencyMatrix</text>
    <text x="14" y="104" class="subtitle">• 3. ApiRegistry &amp; Signatures</text>
    <text x="14" y="122" class="subtitle">• 4. PatternStandards &amp; Hotspots</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 695 152 L 735 152" stroke="#a855f7" stroke-width="2.5"/>
  <polygon points="735,152 727,147 727,157" fill="#a855f7"/>

  <!-- Step 4: GENOME.md Output -->
  <g transform="translate(740, 85)" filter="url(#shadow)">
    <rect width="150" height="135" rx="10" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="12" y="12" width="65" height="18" rx="4" fill="url(#accentPurple)"/>
    <text x="18" y="25" class="badge-text">OUTPUT</text>
    <text x="14" y="48" class="title">GENOME.md</text>
    <text x="14" y="68" class="subtitle" style="fill: #34d399; font-weight: bold;">≤ 500 - 600 Tokens</text>
    <text x="14" y="88" class="subtitle">98.5% Context Saved</text>
    <text x="14" y="106" class="subtitle">Instant Onboarding</text>
    <text x="14" y="124" class="subtitle">Task Entity Slicing</text>
  </g>

  <!-- Bottom Section: Continuous Autopilot & Darwin Memory -->
  <g transform="translate(30, 245)" filter="url(#shadow)">
    <rect width="860" height="165" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="16" y="14" width="130" height="20" rx="4" fill="url(#accentAmber)"/>
    <text x="22" y="28" class="badge-text">FEEDBACK LOOP</text>
    <text x="160" y="29" class="title" style="font-size: 15px; fill: #fbbf24;">System Autopilot &amp; Bayesian Darwin Memory Evolution</text>

    <!-- Sub Box 1: Autopilot -->
    <rect x="20" y="48" width="260" height="98" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="70" class="title" style="font-size: 12px; fill: #38bdf8;">1. Continuous Test Loop</text>
    <text x="32" y="90" class="subtitle">• Code Write &amp; Edit</text>
    <text x="32" y="108" class="subtitle">• Automated Unit Test Discover</text>
    <text x="32" y="126" class="subtitle">• 100% Zero-Defect Gate</text>

    <!-- Arrow Sub 1 to 2 -->
    <path d="M 285 97 L 315 97" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="315,97 308,93 308,101" fill="#fbbf24"/>

    <!-- Sub Box 2: Failure Transition -->
    <rect x="320" y="48" width="260" height="98" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="332" y="70" class="title" style="font-size: 12px; fill: #fbbf24;">2. Failure-to-Success Lesson</text>
    <text x="332" y="90" class="subtitle">• Isolate Bug Root Cause</text>
    <text x="332" y="108" class="subtitle">• Record Verified Resolution</text>
    <text x="332" y="126" class="subtitle">• Register Darwin Pattern</text>

    <!-- Arrow Sub 2 to 3 -->
    <path d="M 585 97 L 615 97" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="615,97 608,93 608,101" fill="#fbbf24"/>

    <!-- Sub Box 3: Darwin Memory -->
    <rect x="620" y="48" width="250" height="98" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="632" y="70" class="title" style="font-size: 12px; fill: #34d399;">3. Bayesian ROI &amp; Atomic Write</text>
    <text x="632" y="90" class="subtitle">• SR_smooth = (S+1)/(N+2)</text>
    <text x="632" y="108" class="subtitle">• Generational Decay &amp; Pruning</text>
    <text x="632" y="126" class="subtitle">• Atomic os.replace Persistence</text>
  </g>
</svg>
